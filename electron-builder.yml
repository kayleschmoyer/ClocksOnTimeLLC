appId: com.clocksontime.waitinglist
productName: Clocks on Time LLC Waiting List
copyright: Copyright © 2026 Clocks on Time LLC

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - node_modules/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  # Uncomment and provide icon when available:
  # icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clocks on Time Waiting List

npmRebuild: true
